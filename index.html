<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json"><title>MOLOM Gear Cloud v6</title>
<style>
:root{--bg:#f4f2ed;--card:#fff;--ink:#151515;--muted:#777;--line:#ddd8cf;--accent:#151515;--ok:#dcebd9}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;background:rgba(244,242,237,.95);backdrop-filter:blur(10px);z-index:5;padding:18px 16px 12px;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0;letter-spacing:.08em}nav{display:flex;gap:8px;margin-top:12px}.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 13px}.tab.active{background:var(--ink);color:white}main{max-width:900px;margin:auto;padding:16px 16px 100px}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar input,.toolbar select,.modal input,.modal select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.item,.project{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.item{cursor:grab}.item h3,.project h3{font-size:15px;margin:0 0 5px}.meta{font-size:12px;color:var(--muted)}.badge{display:inline-block;margin-top:8px;background:#eeeae2;border-radius:999px;padding:4px 8px;font-size:11px}.drop{min-height:90px;border:1.5px dashed #aaa;border-radius:14px;padding:12px;margin-top:10px}.drop.over{background:#ebe7df}.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eee}.check:last-child{border:0}.check.done span{text-decoration:line-through;color:#999}.check button{margin-left:auto;border:0;background:transparent;font-size:18px}.primary,.secondary{border:0;border-radius:12px;padding:11px 14px;font-weight:650}.primary{background:var(--ink);color:white}.secondary{background:#e7e2d9}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.fab{position:fixed;right:18px;bottom:22px;width:56px;height:56px;border-radius:50%;border:0;background:#111;color:white;font-size:28px;box-shadow:0 8px 30px #0003}.modalWrap{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}.modal{background:var(--bg);width:100%;max-width:600px;margin:auto;padding:20px;border-radius:22px 22px 0 0}.modal h2{margin-top:0}.modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}.projectWorkspace{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;align-items:start}.gearShelf{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:112px}.gearShelf h2{font-size:14px;margin:0 0 10px}.shelfScroll{max-height:62vh;overflow-y:auto;padding-right:4px}.shelfItem{border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0;background:#fff;cursor:grab}.shelfItem h3{font-size:14px;margin:0}.shelfItem .meta{margin-top:3px}.projectList{display:grid;gap:10px}.qtyControl{display:flex;align-items:center;gap:5px;margin-left:auto}.qtyControl button{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px;font-size:16px}.qtyNum{min-width:22px;text-align:center;font-size:13px}.check>button.remove{margin-left:6px}@media(max-width:699px){.projectWorkspace{grid-template-columns:1fr}.gearShelf{position:relative;top:auto}.shelfScroll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;max-height:44vh;overflow-y:auto;gap:7px;padding:2px 2px 8px}.shelfItem{min-width:0;margin:0;padding:9px;cursor:pointer}.shelfItem h3{font-size:13px;line-height:1.2}.shelfItem .meta{font-size:10px}.drop{min-height:130px}.gearShelf{max-height:58vh}.toolbar input{font-size:16px}}@media(min-width:700px){.modalWrap{align-items:center}.modal{border-radius:22px}}
</style></head><body>
<header><h1>MOLOM / GEAR <small id="cloudState" style="font-size:10px;letter-spacing:.03em;color:#777">CLOUD</small></h1><nav><button class="tab active" data-view="gear">Gear</button><button class="tab" data-view="projects">Progetti</button></nav></header>
<main><section id="gearView"><div class="toolbar"><input id="search" placeholder="Cerca gear…"><select id="cat"><option value="">Tutte le categorie</option></select></div><div id="gearGrid" class="grid"></div></section><section id="projectsView" hidden><div class="projectWorkspace"><aside class="gearShelf"><h2>GEAR DISPONIBILE</h2><div class="toolbar" style="margin-bottom:8px"><input id="projectSearch" placeholder="Cerca e trascina…"></div><div id="projectGear" class="shelfScroll"></div></aside><div id="projectsGrid" class="projectList"></div></div></section></main><button class="fab" id="add">+</button>
<div class="modalWrap" id="modalWrap"><div class="modal"><h2 id="modalTitle">Nuovo</h2><div id="modalBody"></div><div class="actions"><button class="primary" id="save">Salva</button><button class="secondary" id="cancel">Annulla</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://pfldsdcdthlpmdxgctrh.supabase.co';const SUPABASE_KEY='sb_publishable_YpPoE9asx7QT5WFojdETgw_rJNYKi5a';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const gearGrid=document.getElementById('gearGrid'),projectsGrid=document.getElementById('projectsGrid'),projectGear=document.getElementById('projectGear'),search=document.getElementById('search'),cat=document.getElementById('cat'),projectSearch=document.getElementById('projectSearch'),add=document.getElementById('add'),modalWrap=document.getElementById('modalWrap'),modalTitle=document.getElementById('modalTitle'),modalBody=document.getElementById('modalBody'),save=document.getElementById('save'),cancel=document.getElementById('cancel'),cloudState=document.getElementById('cloudState');let gear=[],projectsData=[];function setCloud(t){cloudState.textContent=t}
async function loadAll(){setCloud('SINCRONIZZO…');const[{data:g,error:ge},{data:p,error:pe},{data:pi,error:ie}]=await Promise.all([db.from('gear').select('*').order('category').order('name'),db.from('projects').select('*').order('created_at',{ascending:false}),db.from('project_items').select('*')]);if(ge||pe||ie){setCloud('OFFLINE');console.error(ge||pe||ie);return}gear=g.map(x=>({id:String(x.id),name:x.name,cat:x.category,qty:x.default_quantity}));projectsData=p.map(x=>({id:x.id,name:x.name,date:x.project_date||x.notes||'',items:pi.filter(i=>i.project_id===x.id).map(i=>{let gg=g.find(z=>z.id===i.gear_id);return{id:i.id,gearId:String(i.gear_id),name:gg?gg.name:'Gear',qty:i.quantity,done:i.checked}})}));renderGear();renderProjects();setCloud('SYNC ✓')}
function renderCats(){let v=cat.value;cat.innerHTML='<option value="">Tutte le categorie</option>'+[...new Set(gear.map(x=>x.cat))].sort().map(c=>`<option>${c}</option>`).join('');cat.value=v}
function renderGear(){renderCats();let q=search.value.toLowerCase(),c=cat.value,a=gear.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!c||x.cat===c));gearGrid.innerHTML=a.map(x=>`<div class="item" draggable="true" data-id="${x.id}"><h3>${x.name}</h3><div class="meta">Quantità: ${x.qty}</div><span class="badge">${x.cat}</span></div>`).join('')||'<div class="empty">Nessun elemento</div>';document.querySelectorAll('.item').forEach(el=>el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.id))}
function renderProjectGear(){let q=(projectSearch.value||'').toLowerCase(),a=gear.filter(x=>!q||x.name.toLowerCase().includes(q)||x.cat.toLowerCase().includes(q));projectGear.innerHTML=a.map(x=>`<div class="shelfItem" draggable="true" data-shelf="${x.id}"><h3>${x.name}</h3><div class="meta">${x.cat} · disponibili: ${x.qty}</div></div>`).join('');document.querySelectorAll('[data-shelf]').forEach(el=>{el.ondragstart=e=>{e.dataTransfer.effectAllowed='copy';e.dataTransfer.setData('text/plain',el.dataset.shelf)};el.onclick=()=>{if(projectsData.length===1)addToProject(projectsData[0].id,el.dataset.shelf)}})}
function renderProjects(){renderProjectGear();projectsGrid.innerHTML=projectsData.map(p=>`<div class="project"><h3>${p.name}</h3><div class="meta">${p.date||'Nessuna data'} · ${p.items.filter(i=>i.done).length}/${p.items.length} pronti</div><div class="drop" data-drop="${p.id}">${p.items.length?p.items.map((i,n)=>`<div class="check ${i.done?'done':''}"><input type="checkbox" ${i.done?'checked':''} data-check="${p.id}|${n}"><span>${i.name}</span><div class="qtyControl"><button data-minus="${p.id}|${n}">−</button><span class="qtyNum">${i.qty}</span><button data-plus="${p.id}|${n}">+</button></div><button class="remove" data-del="${p.id}|${n}">×</button></div>`).join(''):'Trascina qui gli elementi dal menu Gear'}</div><div class="actions"><button class="secondary" data-reset="${p.id}">Reset ✓</button><button class="secondary" data-deletep="${p.id}">Elimina</button></div></div>`).join('')||'<div class="empty">Crea il primo progetto con il pulsante +.</div>';document.querySelectorAll('[data-drop]').forEach(d=>{d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');addToProject(d.dataset.drop,e.dataTransfer.getData('text/plain'))}});document.querySelectorAll('[data-check]').forEach(x=>x.onchange=async()=>{let[p,n]=x.dataset.check.split('|'),it=projectsData.find(z=>z.id===p).items[n];await db.from('project_items').update({checked:x.checked}).eq('id',it.id)});document.querySelectorAll('[data-del]').forEach(x=>x.onclick=async()=>{let[p,n]=x.dataset.del.split('|'),it=projectsData.find(z=>z.id===p).items[n];await db.from('project_items').delete().eq('id',it.id)});document.querySelectorAll('[data-plus]').forEach(x=>x.onclick=async()=>changeQty(x.dataset.plus,1));document.querySelectorAll('[data-minus]').forEach(x=>x.onclick=async()=>changeQty(x.dataset.minus,-1));document.querySelectorAll('[data-reset]').forEach(x=>x.onclick=async()=>db.from('project_items').update({checked:false}).eq('project_id',x.dataset.reset));document.querySelectorAll('[data-deletep]').forEach(x=>x.onclick=async()=>{if(confirm('Eliminare il progetto?'))await db.from('projects').delete().eq('id',x.dataset.deletep)})}
async function changeQty(key,delta){let[p,n]=key.split('|'),it=projectsData.find(z=>z.id===p).items[n],g=gear.find(z=>z.id===it.gearId),qty=Math.max(1,Math.min((g&&g.qty)||99,it.qty+delta));await db.from('project_items').update({quantity:qty}).eq('id',it.id)}async function addToProject(pid,gid){let p=projectsData.find(x=>x.id===pid),g=gear.find(x=>x.id===gid);if(!p||!g)return;let ex=p.items.find(x=>x.gearId===gid);if(ex){await db.from('project_items').update({quantity:Math.min(g.qty,ex.qty+1)}).eq('id',ex.id)}else await db.from('project_items').insert({project_id:pid,gear_id:Number(gid),quantity:1,checked:false})}
function openModal(title,html,onSave){modalTitle.textContent=title;modalBody.innerHTML=html;modalWrap.style.display='flex';save.onclick=async()=>{await onSave();modalWrap.style.display='none'}}
add.onclick=()=>{if(!document.getElementById('projectsView').hidden){openModal('Nuovo progetto','<label>Nome</label><input id="pn" placeholder="Es. Via Decia"><label>Data / note brevi</label><input id="pd" placeholder="Es. 25–27 settembre 2026">',async()=>{let name=document.getElementById('pn').value.trim(),notes=document.getElementById('pd').value.trim();if(name)await db.from('projects').insert({name,notes})})}else openModal('Nuovo gear','<label>Nome</label><input id="gn"><label>Categoria</label><input id="gc"><label>Quantità</label><input id="gq" type="number" min="1" value="1">',async()=>{let name=document.getElementById('gn').value.trim(),category=document.getElementById('gc').value.trim()||'Altro',default_quantity=+document.getElementById('gq').value||1;if(name)await db.from('gear').insert({name,category,default_quantity})})};cancel.onclick=()=>modalWrap.style.display='none';modalWrap.onclick=e=>{if(e.target===modalWrap)modalWrap.style.display='none'};search.oninput=renderGear;cat.onchange=renderGear;projectSearch.oninput=renderProjectGear;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('gearView').hidden=b.dataset.view!=='gear';document.getElementById('projectsView').hidden=b.dataset.view!=='projects';renderGear();renderProjects()});db.channel('molom-gear-live').on('postgres_changes',{event:'*',schema:'public',table:'gear'},loadAll).on('postgres_changes',{event:'*',schema:'public',table:'projects'},loadAll).on('postgres_changes',{event:'*',schema:'public',table:'project_items'},loadAll).subscribe();loadAll();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
